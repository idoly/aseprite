name: Build Aseprite

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: build-windows-x64
  cancel-in-progress: true

jobs:
  check:
    name: Check latest release
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.exists != 'true' }}

    steps:
      - name: Resolve latest stable version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/aseprite/aseprite/releases/latest --jq .tag_name)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$version" >> "$GITHUB_OUTPUT"
          echo "Latest stable version: $version"

      - name: Check private release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG will be built"
          fi

  build:
    name: Windows x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check.outputs.version }}
          submodules: recursive

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up Ninja
        uses: aseprite/get-ninja@main

      - name: Download Skia
        shell: bash
        run: |
          workspace=$(cygpath "${{ github.workspace }}")
          skia_url=$(bash "$workspace/laf/misc/skia-url.sh" release windows x64 | xargs)
          curl --fail --location --retry 3 --ssl-revoke-best-effort \
            --output skia.zip "$skia_url"
          unzip -q skia.zip -d skia

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=skia \
            -DENABLE_OPENSSL=OFF \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)" \
            -DSKIA_LIBRARY="$(realpath skia/out/Release-x64/skia.lib)"

      - name: Build
        run: cmake --build build --target aseprite --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $headers = (& dumpbin /headers build/bin/aseprite.exe) -join "`n"
          $imports = (& dumpbin /dependents build/bin/aseprite.exe) -join "`n"
          if ($headers -notmatch "machine \(x64\)") {
            throw "aseprite.exe is not an x64 executable"
          }
          if ($imports -match "(?i)lib(crypto|ssl).*\.dll") {
            throw "aseprite.exe depends on an OpenSSL runtime DLL"
          }
          $imports

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          Compress-Archive `
            -Path build/bin/* `
            -DestinationPath "Aseprite-$env:VERSION-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Publish private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          archive="Aseprite-$VERSION-Windows-x64.zip"
          title="Aseprite $VERSION"
          notes="Personal Windows x64 build of Aseprite $VERSION. Official source: https://github.com/aseprite/aseprite/releases/tag/$VERSION"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
