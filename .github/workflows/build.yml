name: Build Aseprite

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: build-windows-x64
  cancel-in-progress: true

jobs:
  check:
    name: Check latest release
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      cache_hit: ${{ steps.release-cache.outputs.cache-hit }}
      should_build: ${{ github.event_name == 'workflow_dispatch' || steps.release-cache.outputs.cache-hit != 'true' }}

    steps:
      - name: Resolve latest stable version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/aseprite/aseprite/releases/latest --jq .tag_name)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest stable version: $version"

      - name: Check build status
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: .build-cache
          key: windows-x64-${{ steps.version.outputs.version }}
          lookup-only: true

  build:
    name: Windows x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check.outputs.version }}
          submodules: recursive

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up Ninja
        uses: aseprite/get-ninja@v1

      - name: Download Skia
        shell: bash
        run: |
          workspace=$(cygpath "${{ github.workspace }}")
          skia_url=$(bash "$workspace/laf/misc/skia-url.sh" release windows x64 | xargs)
          curl --fail --location --retry 3 --ssl-revoke-best-effort \
            --output skia.zip "$skia_url"
          unzip -q skia.zip -d skia

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=skia \
            -DENABLE_OPENSSL=OFF \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)" \
            -DSKIA_LIBRARY="$(realpath skia/out/Release-x64/skia.lib)"

      - name: Build
        run: cmake --build build --target aseprite --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $headers = (& dumpbin /headers build/bin/aseprite.exe) -join "`n"
          $imports = (& dumpbin /dependents build/bin/aseprite.exe) -join "`n"
          if ($headers -notmatch "machine \(x64\)") {
            throw "aseprite.exe is not an x64 executable"
          }
          if ($imports -match "(?i)lib(crypto|ssl).*\.dll") {
            throw "aseprite.exe depends on an OpenSSL runtime DLL"
          }
          $imports

      - name: Record successful build
        if: needs.check.outputs.cache_hit != 'true'
        shell: bash
        run: |
          mkdir -p .build-cache
          echo "${{ needs.check.outputs.version }}" > .build-cache/version

      - name: Save build status
        if: needs.check.outputs.cache_hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build-cache
          key: windows-x64-${{ needs.check.outputs.version }}
